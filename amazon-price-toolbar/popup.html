<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>お気に入り商品</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f7;
        color: #222222;
        width: 350px;
      }

      .apt-popup {
        padding: 16px;
      }

      .apt-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .apt-title {
        font-size: 16px;
        font-weight: 600;
      }

      .apt-count {
        font-size: 12px;
        color: #666666;
      }

      .apt-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .apt-card {
        background: #ffffff;
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
      }

      .apt-card-title {
        color: #232f3e;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }

      .apt-card-title:hover {
        text-decoration: underline;
      }

      .apt-card-meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #555555;
      }

      .apt-delete-button {
        position: absolute;
        top: 8px;
        right: 8px;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 16px;
        color: #999999;
      }

      .apt-delete-button:hover {
        color: #e74c3c;
      }

      .apt-empty {
        text-align: center;
        padding: 24px 8px;
        color: #666666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="apt-popup">
      <div class="apt-header">
        <div class="apt-title">お気に入り商品</div>
        <div class="apt-count" id="apt-count">0件</div>
      </div>
      <div class="apt-list" id="apt-list"></div>
      <div class="apt-empty" id="apt-empty">お気に入りに登録された商品はありません</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
