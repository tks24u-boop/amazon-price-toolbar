<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お気に入り商品</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #333;
      background: #f5f5f5;
    }

    /* ヘッダー */
    .header {
      background: #232f3e;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .header .count {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
    }

    /* 空の状態 */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #666;
    }

    .empty-state p {
      margin-top: 12px;
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    /* リスト */
    .favorites-list {
      max-height: 400px;
      overflow-y: auto;
    }

    /* 商品カード */
    .product-card {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .product-card:last-child {
      border-bottom: none;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-title {
      color: #0066c0;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .product-title:hover {
      color: #c45500;
      text-decoration: underline;
    }

    .product-meta {
      margin-top: 6px;
      font-size: 12px;
      color: #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      color: #b12704;
      font-weight: 600;
    }

    .product-date {
      color: #999;
    }

    /* 削除ボタン */
    .delete-button {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #999;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .delete-button:hover {
      background: #fee;
      color: #e74c3c;
    }

    /* スクロールバー */
    .favorites-list::-webkit-scrollbar {
      width: 6px;
    }

    .favorites-list::-webkit-scrollbar-track {
      background: #f0f0f0;
    }

    .favorites-list::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    .favorites-list::-webkit-scrollbar-thumb:hover {
      background: #aaa;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>お気に入り商品</h1>
    <span class="count" id="count">0件</span>
  </header>

  <main id="content">
    <!-- JavaScriptで内容を生成 -->
  </main>

  <script src="popup.js"></script>
</body>
</html>
